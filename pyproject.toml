[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locagent"
version = "0.1.0"
description = "LocAgent: a local coding agent backed by Qwen"
requires-python = ">=3.10"
# 命令行和评测只用标准库；网页界面（uv run locagent-web）用到 FastAPI 和 uvicorn
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

# 安装后可以直接用 locagent 命令启动（uv run locagent）
[project.scripts]
locagent = "locagent.cli:main"
# 评测：uv run locagent-eval
locagent-eval = "locagent.evaluation:main"
# 网页界面：uv run locagent-web --cwd sandbox，然后打开 http://127.0.0.1:8765
locagent-web = "locagent.web.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["locagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
